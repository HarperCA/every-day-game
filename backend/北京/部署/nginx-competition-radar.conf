# 竞赛雷达 北京（2026-11-03）。放到 /etc/nginx/snippets/competition-radar.conf，在 /etc/nginx/sites-available/xiaohuiworks.cn 的 https 那段里
# `location / { return 404; }` 前面加一行 include snippets/competition-radar.conf;
# 小程序接口：入口自己校验令牌、限请求大小（64 KB）
location /api/ {
    client_max_body_size 128k;
    proxy_pass http://127.0.0.1:4330;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 30s;
}
# 两台服务器之间：只放美国服务器的 IP，另外每个请求还要验签名和 5 分钟时效
location = /sync/public {
    allow 107.175.111.18;
    deny all;
    client_max_body_size 3m;
    proxy_pass http://127.0.0.1:4331;
    proxy_read_timeout 120s;
}
location = /sync/review {
    allow 107.175.111.18;
    deny all;
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:4333;
}
# 海报：美国推来的 640x360 JPG，文件名是内容哈希，内容不变，缓存久一点
location /posters/ {
    alias /opt/competition-radar/posters/;
    autoindex off;
    expires 30d;
    add_header Cache-Control "public, immutable";
}
