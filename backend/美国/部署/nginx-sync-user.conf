# 竞赛雷达 北京推用户数据进来（2026-11-03）。放到 /etc/nginx/snippets/competition-radar-sync.conf，在 /etc/nginx/sites-available/admin-dashboard
# 的 https 那段（listen 443）里 `location /api/ {` 前面加一行 include snippets/competition-radar-sync.conf;
# 只放北京服务器的 IP，另外每个请求还要验签名和 5 分钟时效
location = /sync/user {
    allow 154.8.197.241;
    deny all;
    client_max_body_size 3m;
    proxy_pass http://127.0.0.1:4332;
    proxy_read_timeout 120s;
}
