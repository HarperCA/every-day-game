# 竞赛雷达 新赛事助手（2026-11-04）：小程序直连美国（2026-11-01 用户定，不经北京转发），带北京签的令牌，助手自己验。
# 放到 /etc/nginx/snippets/competition-radar-assistant.conf，在 /etc/nginx/sites-available/admin-dashboard 的 https 那段里 `location /api/ {` 前面加一行
# include snippets/competition-radar-assistant.conf;
# 旧路径 /api/assistant 还归旧服务器（线上旧版小程序在用），新路径切换后也继续留着。
# 限速：站点整体是给旧后台设的 2r/s（admin_limit），这里是手机直接来，按 public_limit。
location = /new-api/assistant {
    limit_req zone=public_limit burst=40 nodelay;
    client_max_body_size 32k;
    proxy_pass http://127.0.0.1:4320/api/assistant;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 40s;
}
