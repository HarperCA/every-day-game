# 竞赛雷达 新后台（2026-11-03）：https://107-175-111-18.sslip.io/new-admin/ 转到本机 4318（去掉前缀）。
# 放到 /etc/nginx/snippets/competition-radar-admin.conf，在 /etc/nginx/sites-available/admin-dashboard 的 https 那段里 `location /api/ {` 前面加一行
# include snippets/competition-radar-admin.conf;
# 新后台自己要口令登录（和旧后台同一个口令，ADMIN_TOKEN_FILE），取数据、看海报都要先登录。
# 限速：站点整体是给旧后台设的“每秒 2 个、攒 5 个”（admin_limit），新后台一打开要加载四十来个脚本文件，会被挡（503，11-03 实测）。
# 所以这里单独设：网页文件按 public_limit（每秒 10 个、攒 80 个）；取数据的 api/ 按 admin_limit（每秒 2 个、攒 20 个），口令另有连错 5 次锁 10 分钟。
location = /new-admin { return 301 /new-admin/; }
location /new-admin/api/ {
    limit_req zone=admin_limit burst=20 nodelay;
    client_max_body_size 9m;
    proxy_pass http://127.0.0.1:4318/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
}
location /new-admin/ {
    limit_req zone=public_limit burst=80 nodelay;
    client_max_body_size 9m;
    proxy_pass http://127.0.0.1:4318/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
}
