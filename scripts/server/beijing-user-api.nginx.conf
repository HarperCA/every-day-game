limit_req_zone $binary_remote_addr zone=contest_logs:10m rate=2r/s;
server {
    listen 80;
    server_name 154-8-197-241.sslip.io;
    client_max_body_size 2m;
    location /api/adminData { return 403; }
    location /api/sendReminders { return 403; }
    location /api/clientLog {
        # Migration rehearsal: keep public access closed until filing and cutover verification.
        allow 127.0.0.1;
        deny all;
        limit_req zone=contest_logs burst=10 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 35s;
    }
    location /api/ {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 65s;
    }
    location / { return 404; }
}
