# 限流：同一 IP 每秒最多 2 次请求，防止暴力破解 Basic Auth 或后面的 ADMIN_TOKEN。
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=2r/s;

server {
    listen 80;
    server_name _;

    # 特意放在 /opt/daily-contest 之外：那个目录里直接躺着 .admin-token、
    # .extract-key 这些密钥文件，公开访问的网站根目录不该和密钥文件混在同一棵
    # 目录树里，哪怕权限设对了也不该冒这个险。
    root /var/www/admin-dashboard;
    index index.html;

    auth_basic "竞赛数据管理后台";
    auth_basic_user_file /etc/nginx/.admin-htpasswd;

    limit_req zone=admin_limit burst=5 nodelay;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
