# 后台前端 + API 反代的 nginx 配置。
#
# 注意：HTTPS 那几行是 certbot 自动加的。这个文件现在是「服务器上的完整
# 配置」的副本，包含证书路径——直接 scp 覆盖过去不会再把 HTTPS 冲掉。
# （踩过一次：只传 HTTP 部分上去，证书配置被覆盖，站点直接连不上。）
#
# 证书续期由 certbot 的定时任务管，续期不改这个文件。

# 限流：同一 IP 每秒最多 2 次请求，防止暴力破解 Basic Auth 或后面的 ADMIN_TOKEN。
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=2r/s;

server {
    # 域名写明确，certbot 才能把证书装到对应的 server 块上。
    # sslip.io 是免费的「把 IP 编进域名」服务，解析回本机 IP，不用买域名。
    # 保留裸 IP 是为了老书签还能打开（会被 certbot 加的跳转带到 https）。
    server_name 107-175-111-18.sslip.io 107.175.111.18;

    # 特意放在 /opt/daily-contest 之外：那个目录里直接躺着 .admin-token、
    # .extract-key 这些密钥文件，公开访问的网站根目录不该和密钥文件混在同一棵
    # 目录树里，哪怕权限设对了也不该冒这个险。
    root /var/www/admin-dashboard;
    index index.html;

    limit_req zone=admin_limit burst=5 nodelay;

    # 后端接口转给本机的 Node 服务。浏览器只看到一个域名，没有跨域，
    # 也不再受 CloudBase「安全来源」白名单管——这正是迁移要解决的那个卡点。
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # AI 抽取、批量审核这些慢请求要留足时间，默认 60 秒会中途掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/107-175-111-18.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/107-175-111-18.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = 107-175-111-18.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name 107-175-111-18.sslip.io 107.175.111.18;
    return 404; # managed by Certbot


}