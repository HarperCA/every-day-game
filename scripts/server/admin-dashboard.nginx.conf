# 限流：同一 IP 每秒最多 2 次请求，防止暴力破解 Basic Auth 或后面的 ADMIN_TOKEN。
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=2r/s;

server {
    listen 80;
    server_name _;

    # 特意放在 /opt/daily-contest 之外：那个目录里直接躺着 .admin-token、
    # .extract-key 这些密钥文件，公开访问的网站根目录不该和密钥文件混在同一棵
    # 目录树里，哪怕权限设对了也不该冒这个险。
    root /var/www/admin-dashboard;
    index index.html;

    auth_basic "竞赛数据管理后台";
    auth_basic_user_file /etc/nginx/.admin-htpasswd;

    limit_req zone=admin_limit burst=5 nodelay;

    # 后端接口转给本机的 Node 服务。浏览器只看到一个域名，没有跨域，
    # 也不再受 CloudBase「安全来源」白名单管——这正是迁移要解决的那个卡点。
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # AI 抽取、批量审核这些慢请求要留足时间，默认 60 秒会中途掐断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
